name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.9", os: ubuntu-22.04 }
          - { python-version: "3.11", os: ubuntu-latest }
          - { python-version: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]" "tomli; python_version < '3.11'" "ruff==0.11.13"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: self-audit (the tool runs on its own fixtures, exit 0 expected)
        run: chat-template-audit tests/fixtures/safe_lib
