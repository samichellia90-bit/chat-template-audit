name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]" ruff
      - run: ruff check src tests
      - run: pytest -q
      - name: self-audit (the tool runs on its own fixtures)
        run: |
          chat-template-audit tests/fixtures/safe_lib && echo "safe fixture clean, as expected"
